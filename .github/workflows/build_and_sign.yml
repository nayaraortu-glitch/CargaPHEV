name: Build and Sign Release APK

on:
  push:
    branches: [ main, master ] # O la rama que utilices

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Dar permisos de ejecución a Gradle
      run: chmod +x gradlew

    - name: Compilar APK de Release (sin firmar)
      run: ./gradlew assembleRelease

    - name: Generar keystore temporal para firmar
      run: |
        keytool -genkey -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android -dname "CN=Android, O=Android, C=US"

    - name: Firmar el APK con apksigner
      run: |
        # Busca la ruta exacta del APK generado
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        
        # Firma el APK usando apksigner del SDK de Android
        $ANDROID_HOME/build-tools/*/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android "$APK_PATH"
        
        # Renombra o copia para identificarlo fácilmente
        cp "$APK_PATH" app-release-signed.apk

    - name: Subir APK firmado como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: app-release-signed.apk
