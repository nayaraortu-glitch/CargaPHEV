name: Build and Sign Release APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Compilar APK de Release (sin firmar)
      run: gradle assembleRelease

    - name: Generar keystore temporal
      run: |
        keytool -genkey -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -passin pass:android -passout pass:android "CN=Android, O=Android, C=US"

    - name: Firmar el APK con apksigner
      run: |
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
        $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:android --key-pass pass:android "$APK_PATH"
        cp "$APK_PATH" app-release-signed.apk

    - name: Subir APK firmado como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: app-release-signed.apk
